function genSpark(base, vol, n) {
  n = n || 20;
  const arr = [base];
  for (let i = 1; i < n; i++) {
    const last = arr[arr.length - 1];
    arr.push(+(last * (1 + (Math.random() - 0.5) * vol)).toFixed(6));
  }
  return arr;
}
function liqZones(price) {

    short_price: +(price * (1 + 1 / lev)).toPrecision(6),
  }));
}

function sparklineSVG(data, color) {
  if (!data || data.length < 2) return "";
  const min = Math.min(...data), max = Math.max(...data);
  const range = (max - min) || 1;
  const w = 100, h = 28;
  const pts = data.map((v, i) => `${(i/(data.length-1)*w).toFixed(1)},${(h-((v-min)/range)*h).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-7" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function etfFlowChart(label, data, color) {
  if (!data.length) return `<p class="text-sm italic" style="color:var(--text-3)">Indisponible.</p>`;
  const max = Math.max(...data.map(d => Math.abs(d.net_flow_usd_m)), 1);
  const bars = data.map(d => {
    const h = Math.max(4, Math.abs(d.net_flow_usd_m) / max * 40);
    const pos = d.net_flow_usd_m >= 0;
    return `<div class="flex flex-col items-center justify-end" style="height:44px" title="${d.date}: ${d.net_flow_usd_m}M$">
      <div style="height:${pos ? h : 2}px; width:10px; background:${pos ? color : 'transparent'}; border-radius:2px 2px 0 0"></div>
      <div style="height:1px; width:100%; background:var(--glass-border)"></div>
      <div style="height:${pos ? 2 : h}px; width:10px; background:${pos ? 'transparent' : 'var(--accent-fuchsia)'}; border-radius:0 0 2px 2px"></div>
    </div>`;
  }).join("");
  const total = data.reduce((s,d)=>s+d.net_flow_usd_m,0);
  return `
  <div>
    <div class="flex items-center justify-between mb-1">
      <p class="text-xs font-semibold" style="color:var(--text-2)">${label}</p>
      <p class="text-xs font-mono" style="color:${total>=0?'var(--accent-emerald)':'var(--accent-fuchsia)'}">${total>=0?'+':''}${total.toFixed(0)}M$ (7j)</p>
    </div>
    <div class="flex items-end gap-1.5">${bars}</div>
  </div>`;
}

  return ALL_TRADES.filter(t => {
    if (perfCategoryFilter && t.category !== perfCategoryFilter) return false;
    if (perfPeriodFilter !== "all") {
      const openedAt = new Date(t.opened_at);
      if (now - openedAt > periodMs[perfPeriodFilter]) return false;
    }
    return true;
  });
}
function computeStats(trades) {
  const total = trades.length;
  const wins = trades.filter(t => t.status === "win").length;
  const losses = trades.filter(t => t.status === "loss").length;
  const expired = trades.filter(t => t.status === "expired").length;
  const winRate = total ? Math.round(wins/total*1000)/10 : 0;
  const byCat = {};
  [...new Set(trades.map(t => t.category))].forEach(cat => {
    const catTrades = trades.filter(t => t.category === cat);
    const catWins = catTrades.filter(t => t.status === "win").length;
    byCat[cat] = { total: catTrades.length, wins: catWins, win_rate_pct: catTrades.length ? Math.round(catWins/catTrades.length*1000)/10 : 0 };
  });
  return { total_closed: total, wins, losses, expired, win_rate_pct: winRate, by_category: byCat };
}
function setPerfCategoryFilter(v) { perfCategoryFilter = v; renderTabContent(); }
function setPerfPeriodFilter(v) { perfPeriodFilter = v; renderTabContent(); }
function togglePerfTrade(id) { perfExpandedId = perfExpandedId === id ? null : id; renderTabContent(); }

function tradeRowHTML(t) {
  const expanded = perfExpandedId === t.id;
  const detail = expanded ? `
    <div class="px-3 pb-3 pt-1 border-t" style="border-color:var(--glass-border)">
      <div class="grid grid-cols-3 gap-2 text-sm my-2">
        <div class="rounded-lg border p-2" style="background:var(--glass-bg-strong); border-color:var(--glass-border)"><p class="text-[10px]" style="color:var(--text-3)">Prix d'entrée</p><p class="font-mono" style="color:var(--text-1)">${t.entry}</p></div>
        <div class="rounded-lg border border-fuchsia-400/15 bg-fuchsia-400/5 p-2"><p class="text-[10px]" style="color:var(--text-3)">Stop Loss</p><p class="font-mono" style="color:var(--accent-fuchsia)">${t.stop_loss}</p></div>
        <div class="rounded-lg border border-emerald-400/15 bg-emerald-400/5 p-2"><p class="text-[10px]" style="color:var(--text-3)">Take Profit</p><p class="font-mono" style="color:var(--accent-emerald)">${t.take_profit}</p></div>
      </div>
      <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs" style="color:var(--text-3)">
        <span>Ouvert : ${fmtDateShort(t.opened_at)}</span>
        <span>Clôturé : ${fmtDateShort(t.closed_at)}</span>
        ${t.exit_price != null ? `<span>Prix de sortie : <span class="font-mono" style="color:${STATUS_COLOR[t.status]}">${t.exit_price}</span></span>` : ""}
      </div>
    </div>` : "";
  return `
  <div class="rounded-lg overflow-hidden" style="background:var(--glass-bg)">
    <button onclick="togglePerfTrade(${t.id})" class="w-full flex items-center justify-between text-sm p-2.5 hover:opacity-80 transition text-left">
      <div class="flex items-center gap-2 min-w-0">
        <span class="font-medium truncate" style="color:var(--text-1)">${t.symbol}</span>
        <span class="text-xs whitespace-nowrap" style="color:var(--text-3)">${CATEGORY_LABELS[t.category] || t.category} · ${t.direction}</span>
      </div>
      <div class="flex items-center gap-2 flex-shrink-0">
        <span class="text-xs px-2 py-0.5 rounded-full border" style="color:${STATUS_COLOR[t.status]}; border-color:${STATUS_COLOR[t.status]}66; background:${STATUS_COLOR[t.status]}1a">${STATUS_LABEL[t.status]}</span>
        <span class="text-xs" style="color:var(--text-3)">${expanded ? "▲" : "▼"}</span>
      </div>
    </button>
    ${detail}
  </div>`;
}

function renderPerformance() {
  const trades = filteredTrades();
  const p = computeStats(trades);
  const stat = (val, label, color) => `<div class="rounded-2xl border p-4 text-center" style="background:var(--glass-bg); border-color:var(--glass-border)"><p class="text-2xl font-bold" style="color:${color||'var(--text-1)'}">${val}</p><p class="text-xs mt-1" style="color:var(--text-3)">${label}</p></div>`;
  const byCat = Object.entries(p.by_category).map(([cat, d]) => `<div class="flex items-center justify-between text-sm"><span style="color:var(--text-2)">${CATEGORY_LABELS[cat] || cat}</span><span style="color:var(--text-1)" class="font-mono">${d.win_rate_pct}% (${d.wins}/${d.total})</span></div>`).join("");
  const categoryOptions = Object.keys(CATEGORY_LABELS).map(c => `<option value="${c}" ${perfCategoryFilter===c?'selected':''}>${CATEGORY_LABELS[c]}</option>`).join("");
  const periodButtons = Object.entries(PERIOD_LABELS).map(([key,label]) => `
    <button onclick="setPerfPeriodFilter('${key}')" class="text-xs px-3 py-1.5 rounded-full border transition" style="${perfPeriodFilter===key ? 'background:linear-gradient(90deg, rgba(139,92,246,0.25), rgba(6,182,212,0.25)); border-color:var(--glass-border-strong); color:var(--text-1)' : 'border-color:var(--glass-border); color:var(--text-3)'}">${label}</button>`).join("");

  const body = p.total_closed > 0 ? `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">${stat(p.win_rate_pct+"%","Taux de réussite")}${stat(p.wins,"Gagnants (TP touché)","var(--accent-emerald)")}${stat(p.losses,"Perdants (SL touché)","var(--accent-fuchsia)")}${stat(p.expired,"Expirés","var(--accent-amber)")}</div>
    ${Object.keys(p.by_category).length ? `<div class="rounded-2xl border p-5 mb-6" style="background:var(--glass-bg); border-color:var(--glass-border)"><h3 class="text-sm font-semibold mb-3" style="color:var(--text-2)">Par catégorie</h3><div class="space-y-2">${byCat}</div></div>` : ""}
    <div class="rounded-2xl border p-5" style="background:var(--glass-bg); border-color:var(--glass-border)">
      <h3 class="text-sm font-semibold mb-1" style="color:var(--text-2)">Signaux clôturés</h3>
      <p class="text-xs mb-3" style="color:var(--text-3)">Clique sur un trade pour voir l'entrée, le SL et le TP.</p>
      <div class="space-y-1.5">${trades.map(tradeRowHTML).join("")}</div>
    </div>`
    : `<p class="italic" style="color:var(--text-3)">Aucun signal clôturé pour ces filtres. Élargis la période ou change de catégorie.</p>`;

  return `
  <h2 class="text-xl font-bold mb-6 bg-gradient-to-r from-emerald-400 via-cyan-400 to-fuchsia-400 bg-clip-text text-transparent">📊 Performance des signaux (backtest)</h2>
  <div class="rounded-2xl border p-4 flex flex-wrap items-center gap-3 mb-6" style="background:var(--glass-bg); border-color:var(--glass-border)">
    <div class="flex items-center gap-2">
      <span class="text-xs" style="color:var(--text-3)">Catégorie :</span>
      <select onchange="setPerfCategoryFilter(this.value)" class="text-xs rounded-lg border px-2 py-1.5 outline-none" style="background:var(--glass-bg-strong); border-color:var(--glass-border); color:var(--text-1)">
        <option value="" ${perfCategoryFilter===""?'selected':''}>Toutes</option>
        ${categoryOptions}
      </select>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs" style="color:var(--text-3)">Période :</span>
      <div class="flex gap-1">${periodButtons}</div>
    </div>
  </div>
  ${body}`;
}

// ---- Rendu principal ----
function renderTabContent() {
  let html = "";
  switch (activeTab) {
    case "overview": html = renderOverview(); break;
    case "signals": html = renderSignals(); break;
    case "movers": html = renderMovers(); break;
    case "watchlist": html = renderWatchlist(); break;
    case "performance": html = renderPerformance(); break;
  }
  document.getElementById("tab-content").innerHTML = html;
}
function renderTabs() {
  document.getElementById("tabs-bar").innerHTML = TABS.map(t => `
    <button onclick="setTab('${t.id}')" class="whitespace-nowrap px-4 py-2.5 rounded-t-xl text-sm font-semibold transition border-b-2"
      style="border-color:${t.id===activeTab ? '#22d3ee' : 'transparent'}; color:${t.id===activeTab ? 'var(--text-1)' : 'var(--text-3)'}">
      ${t.label}
    </button>`).join("");
}
function setTab(id) { activeTab = id; renderTabs(); renderTabContent(); }

document.getElementById("root").innerHTML = `
  <header class="border-b px-6 py-5 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-20" style="background:var(--header-bg); border-color:var(--glass-border); backdrop-filter:blur(20px)">
    <div>
      <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 via-[#ff0055] to-[#00ff66] bg-clip-text text-transparent" style="filter: drop-shadow(0 0 14px rgba(0,243,255,0.35))">⚡ MLN SCAN</h1>
      <p class="text-sm mt-1" style="color:var(--text-3)">Scans automatiques (Binance Futures + contexte marché) à 01h • 09h • 14h • 17h • 21h GMT</p>
    </div>
    <div class="flex gap-2">
      <button class="rounded-xl border px-4 py-2 text-sm font-semibold transition hover:opacity-80" style="border-color:var(--glass-border); background:var(--glass-bg); color:var(--text-1)">Tester Telegram</button>
      <button class="rounded-xl border border-cyan-400/30 bg-gradient-to-r from-violet-500/30 to-cyan-500/30 text-white px-4 py-2 text-sm font-semibold transition">Lancer un scan manuel</button>
    </div>
    <div class="cyber-alert rounded-lg text-amber-300 text-xs px-4 py-3 max-w-lg w-full">
      ⚠️ Aperçu statique. Les sections marquées ⚠️ dans l'app réelle nécessitent une clé ANTHROPIC_API_KEY (pics sociaux, flux ETF) — sinon elles restent vides plutôt que d'inventer des données.
    </div>
  </header>
  <div class="p-6 max-w-[1500px] mx-auto">
    <div id="tabs-bar" class="flex gap-2 overflow-x-auto scrollbar-glass mb-6 pb-1 border-b" style="border-color:var(--glass-border)"></div>
    <div id="tab-content"></div>
  </div>
`;

renderTabs();
renderTabContent();
</script>
</body>
</html>
